name: daily-run watchdog
# Runs on GitHub's servers, independent of the laptop. A failed run emails the repo owner
# (GitHub notifies the account that last edited this schedule). Read-only.
on:
  schedule:
    - cron: "11 1 * * *"    # 21:11 EDT / 20:11 EST (same ET day): the 17:00 run should be pushed by then (Nov 5: run moved to 17:00)
    - cron: "41 3 * * *"    # 23:41 EDT / 22:41 EST (same ET day): second look, for slow or late runs
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60
          sparse-checkout: |
            .github
            predictions/log.jsonl
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python .github/watchdog_check.py

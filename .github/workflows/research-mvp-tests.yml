name: Research Factory MVP Tests
on:
  push:
    branches:
      - research/puzzle-finder-phase1-20261119
    paths:
      - 'research/factory/**'
      - 'research/tests/**'
      - '.github/workflows/research-mvp-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install isolated research dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Scientific MVP integration and guards
        run: python -m unittest discover -s research/tests -p 'test_science_mvp.py' -v
      - name: Complete research regression suite
        run: python -m unittest discover -s research/tests -q
